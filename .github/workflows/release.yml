name: Release Github Package

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint

      - name: Format code
        run: pnpm run fmt

      - name: Install Playwright Browsers
        run: pnpm exec playwright install

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

  release:
    name: Release Github Package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19
          registry-url: https://npm.pkg.github.com/
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Generate release notes and publish
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  chromatic:
    name: Run Chromatic
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Run Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
